# KServe InferenceService for serverless model serving.
# Uses the MLflow model from kubernetes-mlflow's MinIO artifact store
# (bucket mlflow-artifacts).
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: default-payment-predictor
  namespace: ml-credit-default
spec:
  predictor:
    serviceAccountName: kserve-minio-sa
    minReplicas: 0
    maxReplicas: 5
    scaleTarget: 10
    scaleMetric: concurrency
    model:
      modelFormat:
        name: sklearn
      # Kept in sync automatically: training_pipeline_v2 promotes the
      # best-scoring run (by ROC AUC) to the `champion` alias on the shared
      # "default-payment-predictor" registered model (mlflow_logger.py), and
      # the `promote` DAG step (argo-workflow.yaml, promote_model.py) resolves
      # that alias and pushes the resulting storageUri here. Don't hand-edit —
      # it'll be overwritten on the next promote run.
      storageUri: "models:/m-a27c2eaef0a04c7098aafe2f767d3d33"
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "512Mi"
    logger:
      mode: all
      url: http://kafka-broker-ingress.knative-eventing.svc.cluster.local/knative-serving/default
