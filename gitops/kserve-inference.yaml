# KServe InferenceService for serverless model serving.
# Uses the MLflow model from kubernetes-mlflow's MinIO artifact store
# (bucket mlflow-artifacts).
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: default-payment-predictor
  namespace: ml-credit-default
spec:
  predictor:
    serviceAccountName: kserve-minio-sa
    minReplicas: 0
    maxReplicas: 5
    scaleTarget: 10
    scaleMetric: concurrency
    model:
      modelFormat:
        name: sklearn
      # default-payment-randomforestclassifier v1 (run
      # a25c4a6715cc4d4193e815d6a09e6e8d, experiment "baseline-models"),
      # picked over the logistic regression run on every metric (accuracy
      # 0.810 vs 0.809, ROC AUC 0.770 vs 0.709, F1 0.399 vs 0.363). No
      # champion-alias/model-selection logic exists yet in
      # training_pipeline_v2 — this was picked and pinned manually. Update
      # this storageUri by hand after each retrain until that's automated.
      storageUri: "s3://mlflow-artifacts/mlflow/1/models/m-9b48b25ce07c4226afc93cf6e7db0878/artifacts"
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "512Mi"
    logger:
      mode: all
      url: http://kafka-broker-ingress.knative-eventing.svc.cluster.local/knative-serving/default
