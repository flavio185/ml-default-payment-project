# Full ML pipeline as an Argo Workflow DAG.
# Each step references shared ClusterWorkflowTemplates (container-step, rayjob-step).
# All steps use container-step now; switch training to rayjob-step when datasets grow.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: full-ml-pipeline
  namespace: ml-credit-default
spec:
  entrypoint: pipeline-dag
  serviceAccountName: argo-workflow-sa
  # ml-credit-default carries istio-injection: enabled (namespace.yaml) for
  # the KServe predictor's benefit — it routes through the Istio mesh
  # (knative-local-gateway). That label is namespace-wide though, so without
  # this override every plain job pod here (bronze/silver/validate/features/
  # training) would also get an istio-proxy sidecar, despite having nothing
  # to do with Knative/Istio. Opt these pods out explicitly instead.
  podMetadata:
    annotations:
      sidecar.istio.io/inject: "false"
  arguments:
    parameters:
      - name: image
        value: "docker.io/flavio185/ml-default-payment-project:latest"
  templates:
    - name: pipeline-dag
      dag:
        tasks:
          - name: bronze
            templateRef:
              name: container-step
              clusterScope: true
              template: run
            arguments:
              parameters:
                - name: step-name
                  value: bronze
                - name: image
                  value: "{{workflow.parameters.image}}"
                - name: cmd
                  value: "uv run python data_processing/bronze/ingest_bronze.py"

          - name: silver
            dependencies: [bronze]
            templateRef:
              name: container-step
              clusterScope: true
              template: run
            arguments:
              parameters:
                - name: step-name
                  value: silver
                - name: image
                  value: "{{workflow.parameters.image}}"
                - name: cmd
                  value: "uv run python data_processing/silver/clean_data.py"

          - name: validate
            dependencies: [silver]
            templateRef:
              name: container-step
              clusterScope: true
              template: run
            arguments:
              parameters:
                - name: step-name
                  value: validate
                - name: image
                  value: "{{workflow.parameters.image}}"
                - name: cmd
                  value: "uv run python data_processing/silver/validate_data.py"

          - name: features
            dependencies: [validate]
            templateRef:
              name: container-step
              clusterScope: true
              template: run
            arguments:
              parameters:
                - name: step-name
                  value: features
                - name: image
                  value: "{{workflow.parameters.image}}"
                - name: cmd
                  value: "uv run python ml_classification/pipelines/feature_pipeline.py"

          - name: training
            dependencies: [features]
            # Project-local override (see local-templates.yaml) — same as
            # container-step but points MLFLOW_TRACKING_URI at
            # kubernetes-mlflow instead of the shared/retired default.
            # Scale-up: change templateRef to rayjob-step for distributed training
            templateRef:
              name: container-step-project
              template: run
            arguments:
              parameters:
                - name: step-name
                  value: training
                - name: image
                  value: "{{workflow.parameters.image}}"
                - name: cmd
                  value: "uv run python ml_classification/pipelines/training_pipeline_v2.py"

          - name: promote
            dependencies: [training]
            # Opens a PR pointing kserve-inference.yaml's storageUri at whatever
            # MLflow run training_pipeline_v2.py just promoted to the `champion`
            # alias, and enables auto-merge. Shared, project-agnostic template —
            # see ml-platform/ArgoWorkflows/cluster-workflow-templates.yaml's
            # promote-model ClusterWorkflowTemplate and base-image/scripts/
            # promote_model.py. Needs a github-credentials Secret (key: token,
            # `repo` scope) in this namespace.
            templateRef:
              name: promote-model
              clusterScope: true
              template: run
            arguments:
              parameters:
                - name: image
                  value: "{{workflow.parameters.image}}"
                - name: model-name
                  value: default-payment-predictor
                - name: repo
                  value: flavio185/ml-default-payment-project
                - name: base-branch
                  value: feature/three-pipeline-architecture
                - name: yaml-path
                  value: gitops/kserve-inference.yaml
                # Shared template's default is the stale/retired shared MLflow
                # endpoint (same one container-step-project overrides above) —
                # point it at this project's real instance instead.
                - name: mlflow-tracking-uri
                  value: "http://mlflow-mlflow.mlflow.svc.cluster.local:5000"
