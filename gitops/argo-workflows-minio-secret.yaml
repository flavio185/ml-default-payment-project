# Argo Workflows' artifact-repository credentials (kubernetes-gitops repo,
# argo-workflows/minio-secret.yaml — same MinIO instance, in the `argo`
# namespace, shared by every project). Reused here, not reinvented: this
# Secret gets mounted directly onto workflow pods by the controller
# (artifactRepository.s3.accessKeySecret/secretKeySecret), so it must exist
# in every namespace that runs Workflows, not just `argo`. Any new project
# namespace running Argo Workflows needs a copy of this same secret.
apiVersion: v1
kind: Secret
metadata:
  name: argo-workflows-minio-secret
  namespace: ml-credit-default
type: Opaque
stringData:
  rootUser: argo-artifacts
  rootPassword: argo-artifacts-secret
  accesskey: argo-artifacts
  secretkey: argo-artifacts-secret
