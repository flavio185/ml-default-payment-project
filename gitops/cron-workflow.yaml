# Scheduled execution of the full ML pipeline.
# Replaces the RayJob CronJob that was generated by CI from conf/job_config.json.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: daily-ml-pipeline
  namespace: ml-credit-default
spec:
  schedule: "0 2 * * *"
  timezone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowSpec:
    workflowTemplateRef:
      name: full-ml-pipeline
    arguments:
      parameters:
        - name: image
          value: "docker.io/flavio185/ml-default-payment-project:latest"
