# Credentials for KServe's storage-initializer to pull model artifacts from
# kubernetes-mlflow's in-cluster MinIO. These are the same dev-grade default
# MinIO root credentials documented throughout the kubernetes-mlflow repo
# (charts/secrets) — safe to commit, unlike real cloud credentials.
apiVersion: v1
kind: Secret
metadata:
  name: kserve-minio-credentials
  namespace: ml-credit-default
  annotations:
    serving.kserve.io/s3-endpoint: minio.mlflow.svc.cluster.local:9000
    serving.kserve.io/s3-usehttps: "0"
    serving.kserve.io/s3-verifyssl: "0"
    serving.kserve.io/s3-useanoncredential: "false"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: mlflow-admin
  AWS_SECRET_ACCESS_KEY: mlflow-minio-secret
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kserve-minio-sa
  namespace: ml-credit-default
secrets:
  - name: kserve-minio-credentials
