# Argo Events for drift-triggered model retraining.
# See ml-platform/Inference/KNativeEventing/README.md "Per-project triggers
# (optional)" for the full pattern this implements.
#
# Flow: ml_classification/pipelines/drift_check.py detects covariate drift
#       -> POSTs to EventSource webhook
#       -> Sensor triggers retraining workflow

---
# EventSource/Sensor pods don't run at all without this -- both stay stuck
# at "EventBus not found" (no backing deployment ever gets created) until an
# EventBus named "default" exists in this namespace, since neither resource
# below sets an explicit spec.eventBusName. Single-replica NATS StreamLayer
# is the minimal viable EventBus; fine for this low-volume webhook.
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
  namespace: ml-credit-default
spec:
  nats:
    native:
      replicas: 1

---
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: drift-detected-source
  namespace: ml-credit-default
spec:
  # Unlike the pipeline steps (see argo-workflow.yaml's podMetadata), this
  # pod has no sidecar.istio.io/inject: "false" of its own, so it gets an
  # auto-injected istio-proxy with a ~2000m default CPU limit on top of its
  # own -- easily enough on its own to blow this namespace's CPU quota.
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
  webhook:
    drift-detected:
      port: "12000"
      endpoint: /drift-detected
      method: POST

---
apiVersion: v1
kind: Service
metadata:
  name: drift-detected-source-eventsource-svc
  namespace: ml-credit-default
spec:
  selector:
    eventsource-name: drift-detected-source
  ports:
    - port: 12000
      targetPort: 12000
  type: ClusterIP

---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: retraining-sensor
  namespace: ml-credit-default
spec:
  # serviceAccountName: without this the Sensor pod runs as the bare
  # `default` ServiceAccount, which can't get workflowtemplates or create
  # workflows -- the trigger fires (event received, matched) but submission
  # fails with PermissionDenied. argo-workflow-sa is the same SA the
  # pipeline steps themselves already run as, so it already has exactly
  # this RBAC.
  # metadata.annotations: same istio-proxy CPU-quota issue as the
  # EventSource above.
  template:
    serviceAccountName: argo-workflow-sa
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
  dependencies:
    - name: drift-event
      eventSourceName: drift-detected-source
      eventName: drift-detected
  triggers:
    - template:
        name: retraining-trigger
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: retraining-
                namespace: ml-credit-default
              spec:
                workflowTemplateRef:
                  name: full-ml-pipeline
                arguments:
                  parameters:
                    - name: image
                      value: "docker.io/flavio185/ml-default-payment-project:latest"
