# Project-scoped override of the shared `container-step` ClusterWorkflowTemplate
# (kubernetes-gitops/argo-workflows/cluster-workflow-templates.yaml), used only
# by the `training` task in argo-workflow.yaml.
#
# Two things differ from the shared template:
# 1. MLFLOW_TRACKING_URI points at kubernetes-mlflow (the shared template may
#    lag behind on other clusters/branches).
# 2. AWS_ACCESS_KEY_ID/SECRET_ACCESS_KEY are sourced from the
#    kserve-minio-credentials Secret (kserve-minio-credentials.yaml — reused
#    here, not just for KServe) instead of the aws-credentials Secret (real
#    AWS) via envFrom like other steps — the training step is the only one
#    that both reads real S3 (gold features) AND writes to MinIO (mlflow.log_model /
#    log_artifact) in the same process, and both would otherwise fight over
#    the same env var names. Real AWS creds are still available, just under
#    DATA_AWS_ACCESS_KEY_ID/SECRET_ACCESS_KEY — see
#    ml_classification/modeling/data_loader.py's _data_aws_credentials(),
#    which reads those explicitly for S3 data-lake access instead of relying
#    on the ambient AWS_ACCESS_KEY_ID/SECRET (reserved here for mlflow->MinIO).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: container-step-project
  namespace: ml-credit-default
spec:
  templates:
    - name: run
      inputs:
        parameters:
          - name: image
          - name: cmd
      retryStrategy:
        limit: "2"
        retryPolicy: OnFailure
      timeout: "30m"
      container:
        image: "{{inputs.parameters.image}}"
        command: ["sh", "-c"]
        args: ["{{inputs.parameters.cmd}}"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "http://mlflow-mlflow.mlflow.svc.cluster.local:5000"
          - name: MLFLOW_S3_ENDPOINT_URL
            value: "http://minio.mlflow.svc.cluster.local:9000"
          - name: MLFLOW_S3_IGNORE_TLS
            value: "true"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: kserve-minio-credentials
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: kserve-minio-credentials
                key: AWS_SECRET_ACCESS_KEY
          - name: DATA_AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: aws-credentials
                key: AWS_ACCESS_KEY_ID
          - name: DATA_AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: aws-credentials
                key: AWS_SECRET_ACCESS_KEY
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "2Gi"
