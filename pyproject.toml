[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ml_classification"
version = "0.0.6"
description = "This is for testing ml classification algorithms"
authors = [
  { name = "Flavio Venturini" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "loguru",
    "pip",
    "pytest",
    "python-dotenv",
    # Pinned to match .pre-commit-config.yaml's ruff-pre-commit rev so
    # `make lint`/CI and the pre-commit hook always agree -- left unpinned,
    # `uv lock` floats this to whatever's newest on PyPI on every full
    # re-resolution, which can newly enable rules pre-commit doesn't check.
    "ruff==0.14.5",
    "typer",
    "pandas",
    "mlflow[extras]>=3.1.1",
    "seaborn>=0.13.2",
    "mkdocs>=1.6.1",
    "great-expectations>=1.5.8",
    "pytest-cov>=6.2.1",
    "s3fs>=2025.7.0",
    "pre-commit>=4.4.0",
    "feast[redis]>=0.41",
    # Used by the `promote` DAG step (gitops/argo-workflow.yaml's promote-model
    # ClusterWorkflowTemplate). Pinned to a branch for now since ml-platform's
    # feature/promote-model-shared-template hasn't merged to main yet — switch
    # this to a tag once it has, so bumps are deliberate rather than floating.
    "mlops-promote @ git+https://github.com/flavio185/ml-platform@main#subdirectory=packages/mlops-promote",
    # Shared training/tracking/pipeline plumbing (MLflowExperimentLogger,
    # create_sklearn_pipeline, train_and_evaluate, S3 dataset-lineage
    # helpers) extracted from this project and iris-project. Same pinning
    # rationale as mlops-promote above.
    "mlops-toolkit @ git+https://github.com/flavio185/ml-platform@main#subdirectory=packages/mlops-toolkit",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["ml_classification"]
include = ["pyproject.toml", "ml_classification/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["ml_classification"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
]

[project.scripts]
project-cli = "make:app"
