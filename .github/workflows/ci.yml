name: CI
on:
  push:
    branches: [main, develop, feature/*, hotfix/*, release/*]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the project
        run: make requirements

      - name: Lint code
        run: make lint

      - name: Run tests with pytest
        run: make test

  set_vars:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      PROJECT_VERSION: ${{ steps.set_vars.outputs.PROJECT_VERSION }}
      REPO_NAME: ${{ steps.set_vars.outputs.REPO_NAME }}
      PROJECT_NAME: ${{ steps.set_vars.outputs.PROJECT_NAME }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set variables
        id: set_vars
        run: |
          echo "PROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | sed 's/\./-/g')" >> $GITHUB_OUTPUT
          echo "REPO_NAME=${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
          echo "PROJECT_NAME=credit-default" >> $GITHUB_OUTPUT

  check-release-exist:
    needs: [validate, set_vars]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check if release exists
        run: |
          PROJECT_VERSION=${{ needs.set_vars.outputs.PROJECT_VERSION }}
          RELEASE_EXISTS=$(gh release view $PROJECT_VERSION > /dev/null 2>&1 && echo "true" || echo "false")
          if [ "$RELEASE_EXISTS" == "true" ]; then
            echo "Release $PROJECT_VERSION already exists. Exiting."
            exit 1
          else
            echo "No existing release found for version $PROJECT_VERSION. Continuing."
          fi

  build-and-push-image:
    needs: [validate, set_vars, check-release-exist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ needs.set_vars.outputs.REPO_NAME }}:${{ needs.set_vars.outputs.PROJECT_VERSION }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ needs.set_vars.outputs.REPO_NAME }}:latest

  update-gitops:
    needs: [build-and-push-image, set_vars]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: DataMaster2026/ml-platform-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Update image tag in manifests
        run: |
          cd gitops/projects/${{ needs.set_vars.outputs.PROJECT_NAME }}
          IMAGE="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ needs.set_vars.outputs.REPO_NAME }}:${{ needs.set_vars.outputs.PROJECT_VERSION }}"

          # Update image parameter in the workflow template
          sed -i "s|docker.io/.*/ml-default-payment-project:[^ ]*|${IMAGE}|g" argo-workflow.yaml || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "ci(${{ needs.set_vars.outputs.PROJECT_NAME }}): update image to ${{ needs.set_vars.outputs.PROJECT_VERSION }}"
          git push

  create-release:
    needs: [update-gitops, set_vars]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        run: |
          gh release create ${{ needs.set_vars.outputs.PROJECT_VERSION }} \
            --title "Release ${{ needs.set_vars.outputs.PROJECT_VERSION }}" \
            --generate-notes || echo "Release already exists, skipping."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: [validate, build-and-push-image, update-gitops, create-release, set_vars]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Display Summary
        run: |
          {
            echo "## CI Summary"
            echo ""
            echo "- Linting and tests passed successfully."
            echo "- Docker image pushed to Docker Hub"
            echo "- GitOps repo updated — Argo CD will auto-sync"
            echo "- Release: ${{ needs.set_vars.outputs.PROJECT_VERSION }}"
          } >> "$GITHUB_STEP_SUMMARY"
